[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sat-test-up-count-track"
version = "0.1.0"
description = "Utilities for extracting video frames and visualizing/syncing GPS trajectories."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pyproj>=3.6",
  "torch>=2.2",
  "Pillow>=10.0",
]

[project.optional-dependencies]
scene = [
  "pyvips>=3.0",
  "pyvips-binary>=8.18.1",
]
scripts = [
  "matplotlib>=3.8",
  "kornia>=0.7",
]
all = [
  "sat-test-up-count-track[scene,scripts]",
]

[project.scripts]
videos-to-frames = "videos_to_frames:main"
vis-gps-on-osm = "vis_gps_on_osm:main"
run-all = "run_all:main"
vis-first-frame-on-tiff = "vis_first_frame_on_tiff:main"
vis-first-frame-on-tiff-interactive = "vis_first_frame_on_tiff_interactive:main"
stitch-frames-on-tiff-map = "stitch_frames_on_tiff_map:main"
stitch-frames-on-tiff-map-interactive = "stitch_frames_on_tiff_map_interactive:main"

[tool.setuptools]
py-modules = ["videos_to_frames", "vis_gps_on_osm", "run_all", "vis_first_frame_on_tiff", "vis_first_frame_on_tiff_interactive", "stitch_frames_on_tiff_map", "stitch_frames_on_tiff_map_interactive"]
packages = ["sat_test_up_count_track"]
